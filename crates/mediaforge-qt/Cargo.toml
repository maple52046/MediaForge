[package]
name = "mediaforge-qt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
cxx = "=1.0.199"
cxx-qt = "=0.9.1"
cxx-qt-lib = { version = "=0.9.1", features = ["qt_full"] }
mediaforge-application.workspace = true
mediaforge-core.workspace = true
mediaforge-ffmpeg.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[build-dependencies]
cxx-qt-build = { version = "=0.9.1", features = ["link_qt_object_files"] }

[lints]
workspace = true
