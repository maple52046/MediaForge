[package]
name = "mediaforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mediaforge_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
mediaforge-core.workspace = true
mediaforge-ffmpeg.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }

# These direct pins preserve the documented Rust 1.85 baseline across Tauri's
# otherwise broad transitive dependency ranges.
serde_with = "=3.8.1"
time = "=0.3.36"
idna_adapter = "=1.1.0"

[lints]
workspace = true
