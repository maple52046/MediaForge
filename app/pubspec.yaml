name: mediaforge
description: MediaForge Flutter desktop presentation shell.
publish_to: none
version: 0.2.0+1

environment:
  sdk: ^3.13.0

dependencies:
  desktop_drop: 0.7.1
  file_picker: 11.0.3
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  flutter_svg: 2.3.0
  media_kit: 1.2.6
  media_kit_libs_video: 1.0.7
  media_kit_video: 2.0.1
  mediaforge_flutter_bridge:
    path: rust_builder
  shadcn_ui: 0.56.1
  shared_preferences: 2.5.5
  window_manager: 0.5.2

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  assets:
    - assets/icons/
    - test/fixtures/
